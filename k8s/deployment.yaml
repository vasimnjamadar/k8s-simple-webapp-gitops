apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-simple-webapp
  namespace: simple-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-simple-webapp
  template:
    metadata:
      labels:
        app: k8s-simple-webapp
    spec:
      containers:
        - name: web
          image: vasimnjamadar/k8s-simple-webapp:5
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
