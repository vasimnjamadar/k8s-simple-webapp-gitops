apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-simple-webapp
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vasimnjamadar/k8s-simple-webapp-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: simple-webapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
